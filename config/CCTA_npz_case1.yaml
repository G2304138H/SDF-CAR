exp:
  dataconfig: ./config/config.yml
  # Generated by generate_2d_projections.py from this same YAML, then consumed
  # by train.py. The original Stage-2 NPZ remains untouched.
  projection_npz: ./generated_inputs/rca_0001_views_from_reference.npz
  reference_volume_npz: /Users/renyu/Downloads/voxel_1.npz
  output_recon_dir: ./logs/reconstructions_npz/
  current_model_id: rca_0001_views_0_1
  view_indices: [0, 1]
  # Fixed by the Stage-2 projection generator; SID is read from the NPZ.
  source_origin_distance_m: 0.75
  reconstruction_nVoxel: [128, 128, 128]
  # null derives the 117.33 mm isocentre FOV from detector width, SID and DSO.
  reconstruction_extent_m: null
  output_occupancy_threshold: 0.5

projection_generation:
  # Supplies theta/phi, SID, detector spacing, clinical labels, and the physical
  # projection centre. Its existing images are not used by the generator.
  camera_metadata_npz: /Users/renyu/Downloads/2d_1.npz
  reference_volume_threshold: 0.0
  minimum_ray_length_mm: 0.000001

network:
  net_type: mlp
  num_layers: 8
  hidden_dim: 256
  skips: [4]
  out_dim: 1
  bound: 0.3
  # sigmoid(-50 * 0.1) ~= 0.0067 initial occupancy, avoiding a solid cube.
  sdf_initial_bias: 0.1
  use_gradient_checkpointing: true

encoder:
  encoding: hashgrid
  input_dim: 3
  num_levels: 16
  level_dim: 2
  base_resolution: 16
  log2_hashmap_size: 19

render:
  netchunk: 699060

visualization:
  save_predicted_projection_pngs: true
  save_surface_gifs: true
  # Match the parametric evaluator's single-surface GIF trajectory and speed.
  surface_gif_frames: 24
  surface_gif_fps: 5
  surface_gif_max_faces: 200000

train:
  epoch: 5000
  lrate: 0.0001
  mixed_precision: true
  weight_decay: 0.000001
  memory_efficient_eval: true
  use_sdf: true
  sdf_alpha: 50.0
  minimum_gradient_norm: 0.000000000001
  zero_gradient_patience: 20
  # Stabilize Kornia's logarithmic distance-transform backward pass and let
  # the projection loss first establish a non-degenerate silhouette.
  sdf_distance_epsilon: 0.000001
  sdf_loss_warmup_epochs: 100
  sdf_loss_ramp_epochs: 400
  # Used only for direct binary-mask inputs. The generated line-integral NPZ
  # bypasses this transform and matches the original SDF-CAR projection loss.
  projection_attenuation: 1.0
  # Internal order is [occupancy projection, 2D geometric SDF].  This maps the
  # paper's lambda_occ=0.25 and lambda_geo=1.0 to the implementation.
  current_loss_weights: [0.25, 1.0]
  camera_noise_enabled: false
  camera_position_noise_std: 0.0
  camera_orientation_noise_std: 0.0
